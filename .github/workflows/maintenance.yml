name: Winbindex maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * SUN'

concurrency: winbindex-maintenance

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          filter: 'blob:none'
      - name: Override out_path
        run: |
          echo ./gh-pages > .out_path_override
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install isal orjson
      - name: Squash old commits
        run: ./maintenance_squash_old_commits.sh gh-pages "7 days ago"
      - name: Push squashed repo
        run: |
          cd gh-pages
          if ! git merge-base --is-ancestor HEAD origin/gh-pages; then
            # The rewritten commits have the same trees as the last original commits. A temporary merge of both lets
            # git see these trees as present on the remote, so that only commit objects are pushed.
            orig=$(git rev-list --first-parent -n "$(git rev-list --count HEAD)" origin/gh-pages)
            merge=$(git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit-tree $(printf -- '-p %s ' HEAD $orig) -m "Temporary merge for squash" "HEAD^{tree}")
            git push origin "$merge:refs/tags/_temp_tag_for_squash_$merge"
            git push --force-with-lease
            git push origin -d "_temp_tag_for_squash_$merge"
          fi
      - name: Delete old items
        run: |
          python -u maintenance_delete_old_items.py 180
          cd gh-pages
          git add .
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff-index --quiet HEAD || git commit -m "Delete data older than 180 days"
          git push
